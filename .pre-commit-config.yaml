# Pre-commit hooks for Na0S
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: tests/

  - repo: local
    hooks:
      - id: extract-facts
        name: Regenerate docs/facts.yaml from source
        entry: python3 scripts/extract_facts.py
        language: system
        pass_filenames: false
        always_run: true
        # Hook writes docs/facts.yaml. If the regenerated file differs from
        # what is staged, pre-commit reports "files were modified by this
        # hook" and the commit fails — re-stage docs/facts.yaml and retry.
        # Numbers must come from this file, never hand-typed in README/docs.
      - id: extract-benchmarks
        name: Regenerate docs/benchmarks.yaml from harness artifacts
        entry: python3 scripts/extract_benchmarks.py
        language: system
        pass_filenames: false
        always_run: true
        # Hook writes docs/benchmarks.yaml from benchmarks/results/*.json. Same
        # contract as extract-facts: benchmark numbers come from this file.
