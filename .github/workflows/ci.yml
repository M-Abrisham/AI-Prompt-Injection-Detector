name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feat/*'
      - 'fix/*'
      - 'refactor/*'
      - 'hardening/*'
      - 'ci/*'
      - 'docs/*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Pre-download the all-MiniLM-L6-v2 weights so the worm-embedding "Live"
      # tests (tests/worm/test_worm_embedding.py::TestEmbeddingSimilarityLive)
      # actually execute instead of skipping. sentence-transformers is already
      # installed via dev -> all -> embedding, but the model weights are not
      # cached by default, so _scorer_available() is False and the calibration
      # assertions never run. These cache paths match WormSignatureDetector's
      # _EmbeddingSimilarity._is_model_cached() lookup.
      - name: Cache sentence-transformer model weights
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-st-model-all-MiniLM-L6-v2-v1

      - name: Pre-download embedding model (all-MiniLM-L6-v2)
        run: |
          # Hard-fail on persistent failure (so a broken download is visible
          # instead of silently re-skipping the live tests), but retry first so
          # a single transient network blip does not break the build.
          for attempt in 1 2 3; do
            if python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"; then
              echo "Model cached on attempt $attempt"
              exit 0
            fi
            echo "Model download attempt $attempt failed; retrying..." >&2
            sleep 15
          done
          echo "Failed to download all-MiniLM-L6-v2 after 3 attempts" >&2
          exit 1

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (non-blocking) for style issues
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Syntax check - compile all Python files
        run: |
          python -c "
          import py_compile, pathlib, sys
          errors = []
          for f in sorted(pathlib.Path('src').rglob('*.py')):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print('All source files compile OK')
          "

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v
          coverage report --show-missing --fail-under=50
          coverage xml -o coverage.xml

      - name: Run quick benchmark (non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: make bench-fast

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Regression Dashboard
        run: python scripts/regression_dashboard.py --run --output json
        continue-on-error: true

      - name: Upload regression artifact
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ github.run_id }}
          path: data/evaluation/regression_history.jsonl
        if: always()
