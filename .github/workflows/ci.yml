name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feat/*'
      - 'fix/*'
      - 'refactor/*'
      - 'hardening/*'
      - 'ci/*'
      - 'docs/*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Deterministic embedding (g6): pin the HF cache dir so the warm step and
    # the test run share one model copy, fetched once at the pinned revision.
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.hf-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: ${{ runner.os }}-hf-minilm-${{ hashFiles('src/na0s/ml/embedding_classifier.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-minilm-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Warm + verify embedding model (fail-fast)
        run: |
          # Fetch the pinned MiniLM revision ONCE into the HF cache and verify
          # it actually serves. A model-load failure reds THIS setup step
          # instead of randomly failing detection tests mid-suite (g6 — the
          # runtime-flaky root fix). The loader (g1/g3) pins the revision and
          # cascades to a deterministic fallback, so `available` is the signal.
          python - <<'PY'
          from na0s.ml.embedding_classifier import get_embedding_classifier
          clf = get_embedding_classifier()
          assert clf.available, "embedding model failed to load; failing setup"
          print("embedding warm OK:", type(clf).__name__)
          PY

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (non-blocking) for style issues
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Syntax check - compile all Python files
        run: |
          python -c "
          import py_compile, pathlib, sys
          errors = []
          for f in sorted(pathlib.Path('src').rglob('*.py')):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print('All source files compile OK')
          "

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v
          coverage report --show-missing --fail-under=50
          coverage xml -o coverage.xml

      - name: Run quick benchmark (non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: make bench-fast

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Regression Dashboard
        run: python scripts/regression_dashboard.py --run --output json
        continue-on-error: true

      - name: Upload regression artifact
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ github.run_id }}
          path: data/evaluation/regression_history.jsonl
        if: always()

      # Single source of truth for per-technique recall + benign FPR.
      # Non-blocking for now: the gate legitimately fails on known coverage
      # gaps (e.g. E2 recon ~0%). Ratchet the floors in `make recall-gate`
      # as those gaps close, then drop continue-on-error to make it blocking.
      - name: Recall harness (single source of truth)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: make recall-gate

      - name: Upload recall harness artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: recall-harness-${{ github.run_id }}
          path: benchmarks/results/technique_analysis.json
          retention-days: 30
