name: Auto-Retrain Model

on:
  schedule:
    # Tuesday 08:00 UTC — after Monday's weekly harvest
    - cron: '0 8 * * 2'

  workflow_run:
    # Retrain after the WEEKLY harvest only. The 3-hourly "Social Scraper"
    # trigger was removed: it fired this ~45-min job ~8x/day (the ROADMAP's
    # "constant red-noise generator"), far more often than a TF-IDF model needs
    # retraining and with runs piling up. Weekly cadence is plenty.
    workflows:
      - "Weekly Dataset Harvest"
    types: [completed]
    branches: [main]

  workflow_dispatch:  # Manual trigger

# Never run two retrains at once: a new trigger queues (at most one pending)
# instead of overlapping. cancel-in-progress: false so a long retrain that is
# already running always finishes rather than being killed by the next trigger.
concurrency:
  group: auto-retrain
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Cap the whole job so a hang (e.g. an OOM-bound feature-extraction step
    # that the runner silently kills after ~28 min) FAILS CLEANLY with a clear
    # "exceeded the maximum execution time" signal instead of a silent cancel.
    # Generous enough for sync + ingest + gen + features + train + gates.
    timeout-minutes: 60
    # Skip if triggered by a failed upstream workflow
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v6

      # Free ~20-25 GB on the runner. The pipeline accumulates large
      # intermediate data (data/raw + data/staging + data/aggregated + a
      # ~2.2M-row combined_data.csv) plus the TF-IDF/feature .pkl artifacts;
      # the default ubuntu-latest disk (~14 GB free) fills near the end and the
      # runner is lost mid-write — surfacing as a silent "The operation was
      # canceled" at the feature-save step. Removing preinstalled toolchains we
      # do not use (dotnet, android SDK, GHC, prebuilt CodeQL) and the cached
      # docker images gives the final save room. Inline rm (no third-party
      # action) to avoid adding a supply-chain dependency to a security project.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn datasets huggingface_hub \
                    requests chardet pyarrow
          pip install -e .

      - name: Sync datasets from registry
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m scripts.sync_datasets

      - name: Ingest harvest & scrape data (quarantine-aware)
        run: python -m scripts.integrate_harvest

      - name: Validate quarantined datasets
        run: python -m scripts.quarantine --validate-quarantined

      - name: Promote validated quarantined → staging
        run: python -m scripts.quarantine --promote-validated

      - name: Validate staged datasets (label quality)
        run: python -m scripts.quarantine --validate-staged

      - name: Promote staged → production
        run: python -m scripts.quarantine --promote-staged-validated

      - name: Generate synthetic training samples (D3/D4/D5/D6/D7/D8/E1/E2/C1/O1/P1)
        run: python scripts/gen_all_datasets.py

      - name: Generate taxonomy-probe training samples (IM/IG/AD/M/T/S/... + gap closure)
        run: python -m scripts.generate_taxonomy_samples

      - name: Merge and deduplicate all data
        run: python -m scripts.process_data

      - name: Validate data quality
        run: python -m scripts.validate_data --fix

      # Hard-negative mining: generate benign samples that resemble attacks
      # (security discussions, benign roleplay, override-like language) and
      # merge them into combined_data.csv to reduce false-positive rate.
      - name: Mine hard negatives into training data
        run: python -m na0s.dataset.hard_negatives

      - name: Extract TF-IDF features
        run: python -m scripts.features

      - name: Train model
        run: python -m scripts.model

      - name: Calibrate decision threshold (GAP-03)
        # Re-fit the decision threshold on the (decontaminated) data after every
        # retrain and ship data/processed/optimal_threshold.json, so the runtime
        # never silently falls back to the uncalibrated 0.55.  NA0S_TARGET_FPR
        # anchors the operating point to the deployment false-positive budget.
        run: NA0S_TARGET_FPR=0.012 python scripts/optimize_threshold.py

      - name: Run canary evaluation
        id: canary
        continue-on-error: true
        run: |
          python -m scripts.canary_eval --model-dir data/processed 2>&1 | tee canary_output.txt
          CANARY_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${CANARY_EXIT}" >> $GITHUB_OUTPUT
          if [ "$CANARY_EXIT" -eq 0 ]; then
            echo "result=PASSED" >> $GITHUB_OUTPUT
            echo "Canary evaluation PASSED -- all quality gates met"
          else
            echo "result=FAILED" >> $GITHUB_OUTPUT
            echo "::error::Canary evaluation FAILED -- quality gates not met"
          fi
          # Extract TPR and TNR lines from output for PR body
          TPR_LINE=$(grep -o 'Injection TPR >= [0-9]*%:.*' canary_output.txt || echo "TPR: unable to parse")
          TNR_LINE=$(grep -o 'Benign TNR    >= [0-9]*%:.*' canary_output.txt || echo "TNR: unable to parse")
          echo "tpr_line=${TPR_LINE}" >> $GITHUB_OUTPUT
          echo "tnr_line=${TNR_LINE}" >> $GITHUB_OUTPUT
          exit 0

      # Shadow evaluation: compare freshly-trained candidate (data/processed/)
      # against current production (src/na0s/models/). Catches regressions the
      # canary gate alone misses -- e.g. F1 drops 5%, FPR doubles -- BEFORE
      # deploy_model.py overwrites production. Was previously dead code (file
      # existed at scripts/shadow_evaluate.py, never invoked here).
      - name: Run shadow evaluation
        id: shadow
        if: steps.canary.outputs.result == 'PASSED'
        continue-on-error: true
        run: |
          python scripts/shadow_evaluate.py \
            --candidate data/processed/ \
            --production src/na0s/models/ \
            --holdout data/canary/canary_eval.csv \
            --output models/shadow_results.json 2>&1 | tee shadow_output.txt
          SHADOW_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${SHADOW_EXIT}" >> $GITHUB_OUTPUT
          if [ "$SHADOW_EXIT" -eq 0 ]; then
            echo "result=PASSED" >> $GITHUB_OUTPUT
            echo "Shadow evaluation PASSED -- candidate meets all promotion gates"
          else
            echo "result=FAILED" >> $GITHUB_OUTPUT
            echo "::error::Shadow evaluation FAILED -- candidate regresses on FPR or recall vs production"
          fi
          exit 0

      # F14 eval decontamination check: ensures no scenario in
      # data/eval/scenarios/ appears in training data (data/processed,
      # data/staging, data/aggregated). Hard block — any overlap aborts the
      # deploy because gate metrics on contaminated training data are
      # artificially inflated.
      - name: Run F14 eval decontamination check
        id: decontam
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'PASSED'
        run: python scripts/check_eval_decontamination.py

      # F14 promotion gate: runs scenarios from data/eval/scenarios/v0.1/
      # through the candidate and compares per-category TPR to the committed
      # baseline. Fails on three regression rules (overall TPR drop, critical
      # category regress, critical severity any-drop).
      - name: Run F14 promotion gate
        id: f14
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'PASSED' && steps.decontam.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/f14_promotion_gate.py \
            --candidate data/processed/ \
            --results models/f14_gate_results.json 2>&1 | tee f14_output.txt
          F14_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${F14_EXIT}" >> $GITHUB_OUTPUT
          if [ "$F14_EXIT" -eq 0 ]; then
            echo "result=PASSED" >> $GITHUB_OUTPUT
            echo "F14 promotion gate PASSED"
          else
            echo "result=FAILED" >> $GITHUB_OUTPUT
            echo "::error::F14 promotion gate FAILED -- see f14_output.txt"
          fi
          exit 0

      - name: Write deployment approval request
        id: approval
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'PASSED' && steps.decontam.outcome == 'success' && steps.f14.outputs.result == 'PASSED'
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          approval_queue = {
            "type": "deploy_approval",
            "requested_at": datetime.now().isoformat(),
            "candidate_path": "data/processed/",
            "gates": {
              "canary": {"passed": True, "exit_code": 0},
              "shadow": {"passed": True, "exit_code": 0},
              "decontam": {"passed": True},
              "f14": {"passed": True, "exit_code": 0}
            },
            "summary": "All gates passed. Ready for human review via iMessage.",
            "status": "pending"
          }

          # Sign the request with HMAC-SHA256 over its canonical JSON (excluding
          # the signature field) IF the shared secret is configured. This mirrors
          # na0s.agents.approvals_sync.sign_request exactly. No-op when the secret
          # is absent, so the workflow stays green before the secret is deployed;
          # the local daemon then runs in backward-compatible unsigned mode.
          import hmac, hashlib, os
          _key = os.environ.get("NA0S_AGENT_APPROVAL_HMAC_KEY")
          if _key:
            _canon = json.dumps(
              {k: v for k, v in approval_queue.items() if k != "signature"},
              sort_keys=True, separators=(",", ":"),
            ).encode("utf-8")
            approval_queue["signature"] = hmac.new(
              _key.encode("utf-8"), _canon, hashlib.sha256
            ).hexdigest()
            print("Approval request signed (HMAC-SHA256).")
          else:
            print("NA0S_AGENT_APPROVAL_HMAC_KEY not set; writing UNSIGNED request.")

          with open("data/approval_queue/pending_deploy.json", "w") as f:
            json.dump(approval_queue, f, indent=2)

          print("Approval request written to data/approval_queue/pending_deploy.json")
          EOF
        env:
          NA0S_AGENT_APPROVAL_HMAC_KEY: ${{ secrets.NA0S_AGENT_APPROVAL_HMAC_KEY }}

      - name: Publish approval request to mail-drop branch
        id: maildrop
        if: steps.approval.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH=agent-approvals
          TMP=$(mktemp -d)

          # Build a minimal worktree holding only the approval file so the
          # mail-drop branch stays tiny and the Mac fetches almost nothing.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git worktree add "$TMP" "origin/$BRANCH"
            git -C "$TMP" checkout -B "$BRANCH"
          else
            git worktree add --detach "$TMP" HEAD
            git -C "$TMP" checkout --orphan "$BRANCH"
            git -C "$TMP" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$TMP/data/approval_queue"
          cp data/approval_queue/pending_deploy.json "$TMP/data/approval_queue/pending_deploy.json"

          git -C "$TMP" add -f data/approval_queue/pending_deploy.json
          git -C "$TMP" commit -m "approval request $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || echo "No change in approval request; nothing to commit"
          git -C "$TMP" push -u origin "$BRANCH"

          git worktree remove --force "$TMP"
          echo "Published approval request to branch $BRANCH"

      - name: Write canary failure report
        id: canary_report
        if: steps.canary.outputs.result == 'FAILED'
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          report = {
            "timestamp": datetime.now().isoformat(),
            "gate": "canary",
            "verdict": "FAILED",
            "exit_code": 1,
            "summary": "Canary evaluation failed. Quality gates not met."
          }

          import os
          os.makedirs("data/approval_queue/failure_reports", exist_ok=True)

          timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          report_path = f"data/approval_queue/failure_reports/canary_{timestamp}.json"

          with open(report_path, "w") as f:
            json.dump(report, f, indent=2)

          print(f"Canary failure report written to {report_path}")
          EOF

      - name: Write shadow failure report
        id: shadow_report
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'FAILED'
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          report = {
            "timestamp": datetime.now().isoformat(),
            "gate": "shadow",
            "verdict": "FAILED",
            "exit_code": 1,
            "summary": "Shadow evaluation failed. Candidate regresses vs production."
          }

          import os
          os.makedirs("data/approval_queue/failure_reports", exist_ok=True)

          timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          report_path = f"data/approval_queue/failure_reports/shadow_{timestamp}.json"

          with open(report_path, "w") as f:
            json.dump(report, f, indent=2)

          print(f"Shadow failure report written to {report_path}")
          EOF

      - name: Write F14 failure report
        id: f14_report
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'PASSED' && steps.f14.outputs.result == 'FAILED'
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          report = {
            "timestamp": datetime.now().isoformat(),
            "gate": "f14",
            "verdict": "FAILED",
            "exit_code": 1,
            "summary": "F14 promotion gate failed. Per-category TPR regression or critical-severity drop."
          }

          import os
          os.makedirs("data/approval_queue/failure_reports", exist_ok=True)

          timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          report_path = f"data/approval_queue/failure_reports/f14_{timestamp}.json"

          with open(report_path, "w") as f:
            json.dump(report, f, indent=2)

          print(f"F14 failure report written to {report_path}")
          EOF

      - name: Check for model changes
        id: diff
        if: steps.approval.outcome == 'success'
        run: |
          if git diff --quiet src/na0s/models/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Model unchanged — skipping PR"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Model updated — will create PR"
          fi

      - name: Create PR with retrained model
        if: steps.approval.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_RESULT: ${{ steps.canary.outputs.result }}
          CANARY_TPR: ${{ steps.canary.outputs.tpr_line }}
          CANARY_TNR: ${{ steps.canary.outputs.tnr_line }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="retrain/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add src/na0s/models/
          git add data/canary/canary_eval.csv
          git commit -m "Retrain model on latest data ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH"

          SAMPLE_COUNT=$(( $(wc -l < data/processed/combined_data.csv) - 1 )) || SAMPLE_COUNT="unknown"
          TODAY=$(date +%Y-%m-%d)

          # Build canary evaluation section for PR body
          if [ "$CANARY_RESULT" = "PASSED" ]; then
            CANARY_ICON="white_check_mark"
            CANARY_STATUS="PASSED"
            CANARY_NOTE="All quality gates met. Model is ready for review."
          else
            CANARY_ICON="warning"
            CANARY_STATUS="FAILED"
            CANARY_NOTE="Quality gates not met. Review carefully before merging."
          fi

          # Build label flags
          LABEL_FLAGS=""
          if [ "$CANARY_RESULT" = "FAILED" ]; then
            LABEL_FLAGS="--label canary-warning"
          fi

          gh pr create \
            --title "Retrain model ($TODAY)" \
            --body "## Auto-Retrain Report

          The model has been retrained on the latest dataset.

          **Pipeline steps completed:**
          1. Synced all datasets from \`data/datasets.yaml\`
          2. Ingested harvest/scrape discoveries via quarantine routing
          3. Validated quarantined datasets (tier-appropriate checks)
          4. Promoted validated → staging
          5. Validated staged datasets (label quality)
          6. Promoted staged → production (\`data/aggregated/\`)
          7. Merged and deduplicated into \`combined_data.csv\`
          8. Extracted TF-IDF features (10K max)
          9. Trained calibrated LogisticRegression
          10. Deployed model + updated \`KNOWN_HASHES\`
          11. Ran canary evaluation (230 hand-verified samples)

          **Training samples:** ~${SAMPLE_COUNT}

          ## Canary Evaluation :${CANARY_ICON}:

          **Overall: ${CANARY_STATUS}**

          | Quality Gate | Result |
          |-------------|--------|
          | ${CANARY_TPR} |
          | ${CANARY_TNR} |

          ${CANARY_NOTE}

          ---
          *Automated by auto-retrain.yml*" \
            --base main ${LABEL_FLAGS}

      - name: Fail workflow if canary did not pass
        if: steps.canary.outputs.result == 'FAILED'
        run: |
          echo "::error::Canary evaluation failed. Deploy and PR were skipped."
          echo "TPR gate: ${{ steps.canary.outputs.tpr_line }}"
          echo "TNR gate: ${{ steps.canary.outputs.tnr_line }}"
          exit 1

      - name: Fail workflow if shadow did not pass
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'FAILED'
        run: |
          echo "::error::Shadow evaluation failed. Deploy and PR were skipped."
          echo "Candidate regresses vs production on one or more promotion gates"
          echo "(max 1% FPR increase, max 0.5% recall drop). See shadow_output.txt."
          exit 1

      - name: Fail workflow if F14 gate did not pass
        if: steps.canary.outputs.result == 'PASSED' && steps.shadow.outputs.result == 'PASSED' && steps.f14.outputs.result == 'FAILED'
        run: |
          echo "::error::F14 promotion gate failed. Deploy and PR were skipped."
          echo "Candidate regressed on per-category TPR, a critical-containing"
          echo "category, or global critical-severity TPR. See f14_output.txt."
          exit 1
