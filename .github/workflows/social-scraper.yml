name: Social Scraper (3h)

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests kaggle
          pip install -e .

      - name: Run social scraper
        id: scrape
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          if [ -z "$TWITTER_BEARER_TOKEN" ]; then
            echo "::warning::TWITTER_BEARER_TOKEN not set -- Twitter scraping will be skipped"
          fi
          python scripts/social_scraper.py --verbose

      - name: Check for new records
        id: check
        run: |
          if [ -f data/scraped/scrape_history.json ]; then
            count=$(python3 -c "import json; h=json.load(open('data/scraped/scrape_history.json')); print(h[-1].get('new_count', 0) if h else 0)")
            echo "new_count=$count" >> $GITHUB_OUTPUT
            echo "Found $count new record(s)"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create PR if new data found
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="scrape/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add data/scraped/
          git commit -m "Add scraped prompt injection data ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "New scraped data: $(date +'%Y-%m-%d %H:%M')" \
            --body "## Social Scraper Report

          Automated social media scrape found **${{ steps.check.outputs.new_count }}** new prompt injection content.

          Review \`data/scraped/scrape_history.json\` for details.

          ---
          *Automated by social-scraper.yml*" \
            --base main
