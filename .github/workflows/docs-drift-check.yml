name: Docs drift check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: README numbers vs source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # extract_facts.py imports na0s.predict for runtime constants,
          # so we need the package installed (not just its deps).
          pip install -e .
          pip install pyyaml

      - name: Regenerate docs/facts.yaml from source
        run: python3 scripts/extract_facts.py

      - name: Detect facts.yaml drift
        id: facts_drift
        run: |
          if git diff --quiet -- docs/facts.yaml; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            printf 'clean — committed docs/facts.yaml matches what extract_facts.py produces from source.\n' > facts_status.txt
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo 'docs/facts.yaml regenerated to a different value than what is committed.'
              echo 'Likely cause: source code changed (rules, taxonomy, constants, L16 detectors, …) without re-running scripts/extract_facts.py.'
              echo
              echo 'Fix locally:'
              echo '    python3 scripts/extract_facts.py'
              echo '    git add docs/facts.yaml'
              echo '    git commit --amend --no-edit  # or as a new commit'
              echo
              echo 'Diff:'
              echo '```diff'
              git diff -- docs/facts.yaml
              echo '```'
            } > facts_status.txt
          fi

      - name: Verify README numbers against facts.yaml
        id: readme_check
        run: |
          set +e
          python3 scripts/check_readme_drift.py > readme_status.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify benchmark docs vs artifact
        run: |
          python3 scripts/extract_benchmarks.py
          git diff --exit-code -- docs/benchmarks.yaml
          python3 scripts/benchmark_report.py --check

      - name: Compose PR comment
        if: always()
        run: |
          facts_label='clean'
          readme_label='clean'
          [ "${{ steps.facts_drift.outputs.drift }}" = "true" ] && facts_label='**drift detected**'
          [ "${{ steps.readme_check.outputs.ok }}" = "true" ] || readme_label='**unverified numbers**'
          {
            echo '<!-- na0s-docs-drift -->'
            echo '## Docs drift check'
            echo
            echo "- facts.yaml: ${facts_label}"
            echo "- README numeric claims: ${readme_label}"
            echo
            echo '<details><summary>facts.yaml status</summary>'
            echo
            cat facts_status.txt
            echo
            echo '</details>'
            echo
            echo '<details><summary>README check output</summary>'
            echo
            echo '```'
            cat readme_status.txt
            echo '```'
            echo '</details>'
            echo
            echo '_Generated by .github/workflows/docs-drift-check.yml — every numeric claim in README.md must trace to docs/facts.yaml._'
          } > comment.md

      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- na0s-docs-drift -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce
        if: steps.facts_drift.outputs.drift == 'true' || steps.readme_check.outputs.ok != 'true'
        run: |
          echo "::error::Docs drift detected. See PR comment."
          exit 1
