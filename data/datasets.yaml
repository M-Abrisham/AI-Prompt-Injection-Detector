# Dataset Registry — declarative config for all training data sources.
# Used by: scripts/sync_datasets.py
#
# To add a new dataset, add an entry here and run sync_datasets.py.
# The sync script reads this file, downloads/updates each source,
# and writes a datasets.lock with commit SHAs for reproducibility.

version: "1.0"
output_dir: "data/raw"

sources:

  # ── GitHub CSV sources ──────────────────────────────────────────

  jailbreak_llms:
    type: github_csv
    url: "https://raw.githubusercontent.com/verazuo/jailbreak_llms/main/data/prompts/jailbreak_prompts_2023_12_25.csv"
    text_column: "prompt"
    label: 1
    output: "jailbreaks.csv"

  awesome_chatgpt_prompts:
    type: github_csv
    url: "https://raw.githubusercontent.com/f/awesome-chatgpt-prompts/main/prompts.csv"
    text_column: "prompt"
    label: 0
    output: "safe_prompts.csv"

  # ── HuggingFace — safe prompt sources ───────────────────────────

  alpaca:
    type: huggingface
    repo: "tatsu-lab/alpaca"
    split: "train"
    text_column: "instruction"
    label: 0
    output: "hf_alpaca.csv"

  dolly:
    type: huggingface
    repo: "databricks/databricks-dolly-15k"
    split: "train"
    text_column: "instruction"
    label: 0
    output: "hf_dolly.csv"

  openassistant:
    type: huggingface
    repo: "OpenAssistant/oasst1"
    split: "train"
    text_column: "text"
    label: 0
    filter:
      role: "prompter"
    output: "hf_openassistant.csv"

  chatbot_instruction_prompts:
    type: huggingface
    repo: "alespalla/chatbot_instruction_prompts"
    split: "train"
    text_column: "prompt"
    label: 0
    output: "hf_chatbot_instruction_prompts.csv"

  llm_lat_benign:
    type: huggingface
    repo: "LLM-LAT/benign-dataset"
    split: "train"
    text_column: "prompt"
    label: 0
    output: "hf_llm_lat_benign.csv"

  wizardlm_evol_instruct:
    type: huggingface
    repo: "WizardLMTeam/WizardLM_evol_instruct_70k"
    split: "train"
    text_column: "instruction"
    label: 0
    output: "hf_wizardlm_evol_instruct.csv"

  ultrachat_200k:
    type: huggingface
    repo: "HuggingFaceH4/ultrachat_200k"
    split: "train_sft"
    text_column: "prompt"
    label: 0
    output: "hf_ultrachat_200k.csv"

  # ── HuggingFace — prompt injection datasets ─────────────────────

  deepset_injections:
    type: huggingface
    repo: "deepset/prompt-injections"
    split: "train"
    text_column: "text"
    label_column: "label"
    label_map:
      0: 0
      1: 1
    output: "hf_deepset_injections.csv"

  safeguard:
    type: huggingface
    repo: "xTRam1/safe-guard-prompt-injection"
    split: "train"
    text_column: "text"
    label_column: "label"
    label_map:
      0: 0
      1: 1
    output: "hf_safeguard.csv"

  spml:
    type: huggingface
    repo: "reshabhs/SPML_Chatbot_Prompt_Injection"
    split: "train"
    text_column: "User Prompt"
    label_column: "Prompt injection"
    label_map:
      0: 0
      1: 1
    output: "hf_spml.csv"

  hackaprompt:
    type: huggingface
    repo: "hackaprompt/hackaprompt-dataset"
    split: "train"
    text_column: "user_input"
    label: 1
    gated: true
    output: "hf_hackaprompt.csv"

  # ── HuggingFace — large aggregated datasets (uncapped) ──────────

  imoxto_cleaned:
    type: huggingface
    repo: "imoxto/prompt_injection_cleaned_dataset-v2"
    split: "train"
    text_column: "text"
    label_column: "labels"
    label_map:
      0: 0
      1: 1
    output: "hf_imoxto_cleaned.csv"

  geekyrakshit:
    type: huggingface
    repo: "geekyrakshit/prompt-injection-dataset"
    split: "train"
    text_column: "prompt"
    label_column: "label"
    label_map:
      0: 0
      1: 1
    output: "hf_geekyrakshit.csv"

  gandalf_rct:
    type: huggingface
    repo: "Lakera/gandalf-rct"
    split: "trial"
    text_column: "prompt"
    label_column: "success"
    label_map:
      true: 1
      false: 0
    filter:
      kind: "prompt"
    max_samples: 100000
    output: "hf_gandalf_rct.csv"

  llmail_inject:
    type: huggingface
    repo: "microsoft/llmail-inject-challenge"
    split: "Phase1"
    text_column: "body"
    label: 1
    output: "hf_llmail_inject.csv"

  ctf_satml24:
    type: huggingface
    repo: "ethz-spylab/ctf-satml24"
    config: "interaction_chats"
    split: "attack"
    text_column: "history"
    label: 1
    output: "hf_ctf_satml24.csv"

  # ── HuggingFace — NEW large datasets ────────────────────────────

  guychuk_classification:
    type: huggingface
    repo: "guychuk/benign-malicious-prompt-classification"
    split: "train"
    text_column: "prompt"
    label_column: "label"
    label_map:
      0: 0
      1: 1
    output: "hf_guychuk_classification.csv"

  # gentelbench: DISABLED — parquet CastError in jailbreaking_attack_dataset.parquet
  # gentelbench:
  #   type: huggingface
  #   repo: "GenTelLab/gentelbench-v1"
  #   split: "train"
  #   text_column: "text"
  #   label_column: "label"
  #   label_map:
  #     0: 0
  #     1: 1
  #   output: "hf_gentelbench.csv"

  alert_standard:
    type: huggingface
    repo: "Babelscape/ALERT"
    config: "alert"
    split: "test"
    text_column: "prompt"
    label: 1
    output: "hf_alert_standard.csv"

  alert_adversarial:
    type: huggingface
    repo: "Babelscape/ALERT"
    config: "alert_adversarial"
    split: "test"
    text_column: "prompt"
    label: 1
    output: "hf_alert_adversarial.csv"

  jailbreakv_28k:
    type: huggingface
    repo: "JailbreakV-28K/JailBreakV-28k"
    config: "JailBreakV_28K"
    split: "JailBreakV_28K"
    text_column: "jailbreak_query"
    label: 1
    output: "hf_jailbreakv_28k.csv"

  salad_data_base:
    type: huggingface
    repo: "OpenSafetyLab/Salad-Data"
    config: "base_set"
    split: "train"
    text_column: "question"
    label: 1
    output: "hf_salad_data_base.csv"

  salad_data_attack:
    type: huggingface
    repo: "OpenSafetyLab/Salad-Data"
    config: "attack_enhanced_set"
    split: "train"
    text_column: "augq"
    label: 1
    output: "hf_salad_data_attack.csv"

  jailbreakhub:
    type: huggingface
    repo: "walledai/JailbreakHub"
    split: "train"
    text_column: "prompt"
    label_column: "jailbreak"
    label_map:
      true: 1
      false: 0
    output: "hf_jailbreakhub.csv"

  qualifire_benchmark:
    type: huggingface
    repo: "qualifire/prompt-injection-jailbreak-dataset"
    split: "train"
    text_column: "text"
    label_column: "label"
    label_map:
      0: 0
      1: 1
    trust_tier: 2
    output: "hf_qualifire_benchmark.csv"
