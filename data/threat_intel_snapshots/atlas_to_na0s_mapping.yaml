# MITRE ATLAS -> Na0S taxonomy mapping  (CURATED, human-reviewable)
# ===========================================================================
# Consumed by: na0s.threat_intel.atlas_sync.AtlasSync._load_mapping()
#   (path resolved from threat_intel/config.py:ATLAS_MAPPING_FILE =
#    data/threat_intel_snapshots/atlas_to_na0s_mapping.yaml)
#
# Format:  {AML.Txxxx: <canonical Na0S code>}
#   - one Na0S "home" category per ATLAS id (the category a runtime input/output
#     defensive SDK would file the technique under).
#   - every right-hand value is a CANONICAL code that passes
#     na0s.eval.harvest.taxonomy.TaxonomyValidator.validate_code() against
#     data/taxonomy.yaml (verified — see tests/eval/harvest/test_atlas_mapping*).
#   - codes are category-level (e.g. E, T, IG) because the live v0.1 scenario
#     set and the harvest extractor both file at category granularity. We never
#     emit a non-canonical code (e.g. E1 / C2 / M1 are intentionally absent —
#     they are NOT keys in taxonomy.yaml and would be rejected at extraction).
#
# ATLAS grounding:
#   Every AML.Txxxx below is a real MITRE ATLAS technique id. This file was
#   authored offline/keyless from curator knowledge of the ATLAS matrix plus
#   keyword-overlap corroboration via atlas_sync.suggest_mapping(). Ids the
#   curator was not confident exist were OMITTED rather than guessed.
#
# Regeneration (when network is available):
#   The canonical id list can be re-derived from a vendored atlas-data dist
#   (mitre-atlas/atlas-data dist/v*/ATLAS-*.yaml) parsed with cti-python-stix2
#   (oasis-open/cti-python-stix2 `parse()`); diff the parsed id set against the
#   keys below and reconcile new/renamed ids by hand. atlas_sync.apply() refuses
#   to auto-write taxonomy.yaml, so any taxonomy change stays human/PR-reviewed.
#   The MANY attacker-side ATLAS techniques (recon, staging, ML-infra, model
#   theft logistics, etc.) are deliberately UNMAPPED: a runtime prompt-injection
#   SDK does not observe them at the input/output boundary, so leaving them
#   unmapped lets atlas_sync flag them for review instead of mis-filing them.
# ===========================================================================

