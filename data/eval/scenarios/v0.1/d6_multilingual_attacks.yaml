#
# Spec 05 (specs/05-D6-multilingual.md), PART 1: measurement set.
# Every payload is a PARAPHRASE/TRANSLATION of a canonical injection technique
# (direct override, system-prompt extraction, roleplay/unrestricted, code-switch,
# transliteration) — never copied verbatim from MultiJail / RTP-LX / Aya /
# PolygloToxicityPrompts. Each attack is 1:1 paired with a benign multilingual
# sibling in d6_multilingual_benign.yaml that shares surface vocabulary.
#
# Difficulty bands:
#   easy   — direct native override (Tier A, regression guards; detector HITS today)
#   hard   — subtle/indirect system-prompt extraction (Tier B; detector MISSES today)
#   medium — transliteration/romanization (Tier C) and code-switch (Tier D)
#
# Provenance: source=synthesized, technique paraphrased by the author from the
# public taxonomy of multilingual prompt-injection (no external text pasted).

