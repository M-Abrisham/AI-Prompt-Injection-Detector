# I2 — HTML / Markup Injection scenarios (Spec 07, item I2).
#
# Threat: prompt-injection instructions hidden in HTML/markup that an LLM
# ingests as data — inside <!-- comments -->, display:none / hidden divs,
# and invisible-text CSS (font-size:0, opacity:0, off-screen, color-on-bg,
# clip, aria-hidden). Detector: src/na0s/input/html_extractor.py
# (extract_safe_text), wired at predict.py:1888-1890 — flag
# hidden_html_content -> I2.1, suspicious_html_comment -> I2.2.
#
# Provenance: all payloads SYNTHESIZED / paraphrased for this scenario set
# (source: synthesized). The HIDING TECHNIQUES are public knowledge
# (OWASP LLM01 indirect injection; embracethered "invisible prompt"
# write-ups), but no payload string is copied verbatim from any source.
# Each attack pairs with a benign HTML/markup sibling sharing the same
# surface (real CSS, real comments, legit hidden form fields / sr-only
# labels / collapsed UI) via paired_benign_id.
#
# Taxonomy note (tag-vs-category divergence — intentional, do NOT "fix"):
# html_extractor has no dedicated I2.3 flag. font-size:0 / opacity:0 /
# off-screen all emit `hidden_html_content` -> tagged I2.1 by predict.py.
# We still label the *scenario* attack_category as I2.3 where the technique
# is invisible-text-CSS, because the F14 scorer keys per-category TPR off
# the scenario's attack_category, not the emitted flag tag.
#
# Difficulty / xfail honesty: payloads carrying an explicit override
# ("ignore all previous instructions…") are reliably blocked (extractor
# flag + ML/rules on the leaked-or-not text). Keyword-free hidden payloads
# whose own ML/rule score is below threshold are documented KNOWN GAPS —
# their scan-level verdict is `allowed` even though the extractor suppresses
# + flags display:none/font-size:0/opacity:0. Those are marked
# expected_verdict accordingly with the gap called out in `description`;
# the recall test mirrors them as xfail. No assertion is weakened.

# ─────────────────────────────────────────────────────────────────────
# I2.1 — Hidden-div (display:none / visibility:hidden / boolean hidden)
# ─────────────────────────────────────────────────────────────────────

