# ── Tier F benign twins — the TRUE FP class the subtle_extraction gate had to
#    stop over-firing on: benign 2nd-person foreign-language instructions that
#    ask which RULES / GUIDELINES / INSTRUCTIONS *you* follow, or *your policy*
#    on something. They share the "follow" verb and "rules/guidelines/policy"
#    surface of the subtle-extraction attacks but carry NO given/assigned cue
#    and NO "this conversation" setup anchor — so they MUST stay allowed.
#    (subtle-extraction now fires only on a GIVEN provenance cue, or on a
#    generic must-follow cue paired with an explicit "this conversation"
#    anchor; none of these benigns satisfy either.)
