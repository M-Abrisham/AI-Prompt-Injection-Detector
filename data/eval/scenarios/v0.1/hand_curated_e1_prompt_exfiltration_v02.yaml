# E1-v0.2 — hardened. Supersedes v0.1 easy-set for the harder half of the
# attack distribution: obfuscation layering, indirect/RAG injection,
# multi-turn escalation, hard-negative benign pairs, and one real-world
# anchor. v0.1 file is kept alongside (not replaced).
#
# Deviations from task brief:
#   - severity: "none" is not accepted by schema.py __post_init__; benign
#     entries use severity: low (matches v0.1 precedent).
#   - difficulty is typed Optional[int] in the dataclass but stored as
#     strings "medium"/"hard" here per the task brief; loader passes
#     through unchanged.

