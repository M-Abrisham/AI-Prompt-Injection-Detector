[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "na0s"
version = "0.1.0"
description = "Multi-layer prompt injection detection for LLM applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mehrnoosh Abrishamchian"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["prompt-injection", "llm", "security", "ai-safety", "guardrails"]

# ---------------------------------------------------------------------------
# Dependency version policy  (last audited: 2026-02-24)
#
# Each dependency has a minimum version floor (security / correctness) and
# a major-version upper bound (<N) to prevent surprise breaking changes.
#
# Dependency        | Min   | Why min                                   | Upper
# ------------------|-------|-------------------------------------------|------
# scikit-learn      | 1.3   | API stability (set_output, ONNX compat)   | <2
# numpy             | 1.24  | numpy.typing, Python 3.9+ wheels          | <3
# tiktoken          | 0.5   | cl100k_base encoding for GPT-4            | <1
# chardet           | 5.0   | performance rewrite, Python 3.10+ support | <6
# ftfy              | 6.2   | CRITICAL: 6.2 fixes #202 (en-dash +       | <7
#                   |       |   mojibake producing wrong Cyrillic chars) |
#                   |       |   Versions <6.2 are UNSAFE for Na0S.       |
# ---------------------------------------------------------------------------
dependencies = [
    "scikit-learn>=1.3,<2",
    "numpy>=1.24,<3",
    "tiktoken>=0.5,<1",
    "chardet>=5.0,<6",
    "ftfy>=6.2,<7",
    "requests>=2.31,<3",
    "anthropic>=0.50.0,<2",
]

[project.scripts]
na0s = "na0s.cli:main"

[project.optional-dependencies]
lang = [
    "langdetect>=1.0.9,<2",
]
embedding = [
    # NOTE (CVE-2026-4372, CVSS 7.8 HIGH): transformers 4.56.0..<5.3.0 has an
    # RCE via a malicious config.json `_attn_implementation_internal` that flows
    # through the optional `kernels` package's get_kernel_hub() dispatch and
    # imports an attacker repo (verified: NVD CVE-2026-4372, fixed in
    # transformers>=5.3.0). IMPORTANT: this CVE *bypasses* trust_remote_code=False
    # — that flag does NOT cover it. The runtime control na0s.integrity.hf_loading
    # provides against THIS CVE is the PINNED `revision=<trusted SHA>` (a poisoned
    # upstream config.json can't be pulled); trust_remote_code=False/use_safetensors
    # there mitigate the SEPARATE custom-code and pickle-.bin RCE paths, not this
    # one. Two other mitigations live outside this runtime: the transformers>=5.3.0
    # floor (the advisory's fix), and simply not installing the optional `kernels`
    # package (the exploit chain requires it). The `transformers>=5.3.0` version
    # FLOOR is intentionally NOT added here: it conflicts with the pinned
    # `sentence-transformers<4` below (ST <4 caps transformers<5.0.0), which
    # would make this extra UNINSTALLABLE. TODO(supply-chain): once the ST floor
    # is bumped to a v5-compatible release (ST>=5), add
    # `"transformers>=5.3.0,<6"` here and `transformers==<pin>` to
    # requirements-benchmark.txt. Tracked as SUP-HF-PIN in ROADMAP_V2.md.
    "sentence-transformers>=2.2,<4",
    "faiss-cpu>=1.7.4",
]
ocr = [
    "easyocr>=1.7,<2",
    "Pillow>=10.0,<13",
]
docs = [
    "pymupdf>=1.23,<2",
    "python-docx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=0.6,<1",
    "striprtf>=0.0.22,<1",
]
llm = [
    "openai>=1.0,<3",
    "groq>=0.4,<2",
]
all = [
    "na0s[lang,embedding,ocr,docs,llm]",
]
data = [
    "datasets>=2.14",
    "huggingface-hub>=0.19",
    "cleanlab>=2.5",
    "datasketch>=1.6",
    "dvc>=3.0",
    "langdetect>=1.0",
    "tqdm>=4.65",
    "pyarrow>=14.0",
    "pandas>=2.0,<3",
]
threatintel = [
    "PyYAML>=6.0.1,<7",
]
audit = [
    "cleanlab>=2.6.0",
]
dev = [
    "na0s[all,data]",
    "coverage>=7.0",
    "flake8>=6.0",
    "groq>=0.4",
    "hypothesis>=6.0",
    "langdetect>=0.1.1",
    "pytest>=7.0",
    "PyYAML>=6.0.1,<7",
]

[project.urls]
Repository = "https://github.com/M-Abrisham/Na0S"
Issues = "https://github.com/M-Abrisham/Na0S/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["na0s*"]

[tool.setuptools.package-data]
"na0s" = ["py.typed"]
"na0s.models" = ["*.pkl", "*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["na0s"]
omit = ["scripts/*", "tests/*"]
